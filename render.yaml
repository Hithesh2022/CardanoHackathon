services:
  # Frontend only - backend runs locally in Docker with public tunnel
  - type: web
    name: atlascred-frontend
    env: node
    rootDir: frontend
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE
        value: "https://metro-alleged-gotten-logo.trycloudflare.com"
      - key: NEXT_PUBLIC_DUST_TREASURY_ADDRESS
        value: "midnight1qxyzdusttreasury"
      - key: NEXT_PUBLIC_DUST_ASSET_ID
        value: "DUST"